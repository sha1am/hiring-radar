services:
  radar:
    build: .
    image: hiring-radar:latest
    # No container_name on purpose. A fixed container_name is GLOBAL to the
    # docker daemon, not scoped to this project, so renaming the directory (or
    # running a second copy) collides with the container the old project still
    # holds — "the container name /hiring-radar is already in use". Letting
    # compose name it <project>-radar-1 keeps `docker compose logs -f` and
    # every other compose command working, and can never conflict.
    restart: unless-stopped

    # Published to loopback only. The process inside binds 0.0.0.0 because it
    # must, but the dashboard has no authentication — do not change the left
    # side of this mapping to 0.0.0.0 without putting an auth proxy in front.
    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      # Your config, read-only. Copy config.example.toml -> config.toml first.
      - ./config.toml:/app/config.toml:ro
      # Which companies to watch. Read on every crawl, so editing a file here
      # takes effect within a cycle — no rebuild and no restart. Read-only to
      # the container: these are yours to edit, not the app's to rewrite.
      - ./companies:/app/companies:ro
      # SQLite lives here so the queue, the seen-set and the rolling budget all
      # survive `docker compose down`.
      - radar-data:/data

    # Secrets: SMTP_PASSWORD, OPENAI_API_KEY, and LI_AT / LI_JSESSIONID if you
    # enable voyager. env_file carries all of them; none belong in config.toml.
    env_file:
      - path: .env
        required: false

    environment:
      RADAR_BIND: 0.0.0.0:8080
      # What the ntfy "open dashboard" button and the alert emails link to.
      # Change if you reverse-proxy this somewhere else.
      RADAR_BASE_URL: ${RADAR_BASE_URL:-http://127.0.0.1:8080}
      RUST_LOG: ${RUST_LOG:-hiring_radar=info,tower_http=warn}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  radar-data:
