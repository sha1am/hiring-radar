[package]
name = "hiring-radar"
version = "0.1.0"
edition = "2021"
description = "Self-hosted hiring-post radar: detect -> classify -> resume-match -> tiered release under a rolling alert budget -> ntfy push + email + dashboard"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.5", features = ["trace"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
scraper = "0.19"
blake3 = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
toml = "0.8"
# RFC3339 / date parsing for source-reported post timestamps. No "clock"
# feature: we only parse, never read the local zone.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Pure-Rust PDF text extraction for resume upload. Text-layer only: a scanned
# resume yields nothing, which the UI reports rather than silently accepting.
pdf-extract = "0.7"

[profile.release]
lto = "thin"
